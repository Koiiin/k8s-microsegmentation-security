apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-nginx
  namespace: microseg-demo
  labels:
    app: backend-nginx
    tier: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-nginx
  template:
    metadata:
      labels:
        app: backend-nginx
        tier: backend
        security-zone: internal
    spec:
      nodeSelector:
        node-zone: backend-zone
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-svc
  namespace: microseg-demo
  labels:
    app: backend-nginx
spec:
  type: ClusterIP
  selector:
    app: backend-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
